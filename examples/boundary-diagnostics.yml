        value: true
        reviewer_role: researcher
        reviewed_at: '2026-10-16'
    visible_label_exception_requested: true
    user_labeling_obligation_disclosed: true
    user_use_responsibility_disclosed: true
    exception_log_retained: true
    log_retention_period_months: 6
  before_fix_9694fb3: null
  expected: review
- case_id: prompt_without_consent_prompt
  control_id: CTRL-DEEPSYN-FACE-VOICE-USER-PROMPT
  description: Prompt told the user to inform the edited person but not to obtain separate consent (Deep Synthesis Art. 14(2)).
  evidence:
    deep_synthesis_face_or_voice_editing_feature: true
    user_notified_to_inform_edited_person: true
    user_prompted_to_obtain_separate_consent: false
    user_prompt_timestamp: '2026-07-15T10:00:00Z'
    human_reviews:
      face_voice_feature_scope:
        completed: true
        result: pass
        reviewer_role: compliance_reviewer
        reviewed_at: '2026-07-15'
  before_fix_9694fb3: null
  expected: fail
