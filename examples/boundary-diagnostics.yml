    file_supports_metadata: true
    generated_content_attribute: '1'
    service_provider_name_or_code: P
    content_id: I
    content_production_elements: local
    dissemination_service_provider_code: null
    dissemination_content_id: null
  before_fix_9694fb3: pass
  expected: pass
- case_id: metadata_empty_strings
  control_id: CTRL-AIGC-METADATA-LABEL
  description: Three base metadata fields are empty strings.
  evidence:
    output_is_ai_generated: true
    generated_content_attribute: ''
    service_provider_name_or_code: ''
    content_id: ''
  before_fix_9694fb3: pass
  expected: fail
- case_id: exception_missing_lifecycle_stage
  control_id: CTRL-AIGC-VISIBLE-LABEL-EXISTENCE
