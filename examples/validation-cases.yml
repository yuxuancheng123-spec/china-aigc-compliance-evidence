    - case_name: Creator v. face-swap app operator (AI face-swap templates)
      case_name_zh: 短视频模特诉某换脸 App 运营者（AI 换脸模板案）
      court: Beijing Internet Court (first instance, not yet effective when reported)
      court_zh: 北京互联网法院（一审，报道时尚未生效）
