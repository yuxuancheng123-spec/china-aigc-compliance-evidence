norm_id: CN-AIGC-COMPLAINT-001
source: &genai_complaint_source
  source_id: GENAI-2023
  document_title_zh: 生成式人工智能服务管理暂行办法
  document_title_en: Interim Measures for the Management of Generative AI Services
  issuing_authority: 国家互联网信息办公室等七部门
  article: 第十五条
  source_text_zh: 提供者应当建立健全投诉、举报机制，设置便捷的投诉、举报入口，公布处理流程和反馈时限，及时受理、处理公众投诉举报并反馈处理结果。
  working_translation_en: Providers should establish complaint and reporting mechanisms, provide convenient entry points, disclose handling processes and feedback time limits, and handle and respond to public complaints promptly.
  source_url: https://www.cac.gov.cn/2023-07/13/c_1690898327029107.htm
  source_url_specificity: document_page
  promulgation_date: '2023-07-10'
  effective_date: '2023-08-15'
  retrieved_at: '2026-07-15'
  source_snapshot: {retrieved_at: '2026-07-15', source_excerpt_sha256: 63360b01df5fd0edfd221b3009c51cde9eac72d57bba405298fad1181b670fab, source_document_sha256: null, verification_status: metadata_only}
norm: {regulated_actor: generative_ai_service_provider, modality: must, action: maintain_complaint_mechanism, object: complaint_mechanism_and_complaint_records, trigger: {service_provided_to_public_in_prc: true}, exceptions: [], deadline_or_timing: mechanism_ongoing; handling_within_disclosed_feedback_time_limit}
interpretation: {control_objective: Separate the standing mechanism duty (entry point, published process and time limit) from per-complaint handling; route convenience and timeliness to review, automation_level: human_review_required, ambiguity_level: medium, reviewer_note: 'Version 1.2 splits the article into two controls: the mechanism duty applies whether or not any complaint has arrived; handling applies per complaint. Convenience (便捷) and timeliness (及时) need keyed human review.'}
evidence: {evidence_type: complaint_mechanism_record, required_fields: [complaint_entry_point_available, complaint_process_disclosed, feedback_time_limit_disclosed]}
test: {expression: complaint_entry_point_available == true and complaint_process_disclosed == true and feedback_time_limit_disclosed == true, pass_condition: Entry point and published process and time limit are recorded, fail_condition: Reviewer confirms a required element is absent, review_condition: Convenience review or a negative finding is pending.}
review: {author_review_status: reviewed, legal_expert_review_status: not_reviewed, reviewer_role: researcher, reviewer_name: null, review_date: '2026-11-10', interpretation_version: '1.2', review_notes: Internally reviewed by the researcher; no independent qualified legal expert review is recorded.}
